name: authenticated backtest

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/backtest-trigger"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KALSHI_ENV: prod
      KALSHI_PROD_KEY_ID: ${{ secrets.KALSHI_PROD_KEY_ID }}
      KALSHI_PROD_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PROD_PRIVATE_KEY_PEM }}
      KALSHI_PROD_KEY_PATH: .secrets/kalshi_prod.pem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check Kalshi secrets
        id: credentials
        shell: bash
        run: |
          if [[ -z "$KALSHI_PROD_KEY_ID" || -z "$KALSHI_PROD_PRIVATE_KEY_PEM" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated backtest skipped: configure repository Actions secrets."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize private key
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s' "$KALSHI_PROD_PRIVATE_KEY_PEM" > "$KALSHI_PROD_KEY_PATH"

      - name: Install
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install -e .

      - name: Resolve execution sample size
        id: sample
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          raw="$(tr -d '[:space:]' < .github/backtest-trigger)"
          if [[ "$raw" =~ ^[0-9]+$ && "$raw" -gt 0 ]]; then
            max_markets="$raw"
          else
            max_markets=100
          fi
          echo "max_markets=$max_markets" >> "$GITHUB_OUTPUT"

      - name: 200-market production-model calibration
        id: calibration
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        run: |
          python src/research/backtest.py BTC \
            --max-markets 200 \
            --min-edge-cents 2 \
            --vol-window-seconds 300 \
            --volatility-scale 1.0 \
            --skip-market-relative \
            --skip-quotes \
            --output-dir output/calibration_200

      - name: Upload calibration
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-calibration-200
          path: output/calibration_200
          if-no-files-found: warn
          retention-days: 14

      - name: Chronological volatility-model sweep
        id: sweep
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        run: |
          python src/research/model_sweep.py BTC \
            --max-markets 200 \
            --windows 60,120,300,600 \
            --scales 0.75,1.0,1.25 \
            --output-dir output/model_sweep

      - name: Upload model sweep
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-model-sweep
          path: output/model_sweep
          if-no-files-found: warn
          retention-days: 14

      - name: Market-relative and quote diagnostics
        id: diagnostics
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        run: |
          python src/research/backtest.py BTC \
            --max-markets ${{ steps.sample.outputs.max_markets }} \
            --min-edge-cents 2 \
            --vol-window-seconds 300 \
            --volatility-scale 1.0 \
            --output-dir output/backtests

      - name: Upload market diagnostics
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-market-diagnostics
          path: output/backtests
          if-no-files-found: warn
          retention-days: 14

      - name: Production taker-strategy replay
        id: strategy
        if: steps.credentials.outputs.available == 'true'
        continue-on-error: true
        run: |
          python src/research/strategy_backtest.py BTC \
            --max-markets ${{ steps.sample.outputs.max_markets }} \
            --starting-cash-cents 100000 \
            --fee-multiplier 1.0 \
            --assumed-top-size 10 \
            --output-dir output/strategy_backtests

      - name: Upload strategy replay
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-strategy-replay
          path: output/strategy_backtests
          if-no-files-found: warn
          retention-days: 14

      - name: Require every research stage
        if: always() && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          failed=0
          for result in             "${{ steps.calibration.outcome }}"             "${{ steps.sweep.outcome }}"             "${{ steps.diagnostics.outcome }}"             "${{ steps.strategy.outcome }}"; do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

name: authenticated baseline

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KALSHI_ENV: prod
      KALSHI_PROD_KEY_ID: ${{ secrets.KALSHI_PROD_KEY_ID }}
      KALSHI_PROD_KEY_PATH: .secrets/kalshi_prod.pem
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Materialize read credentials
        env:
          PRIVATE_KEY: ${{ secrets.KALSHI_PROD_PRIVATE_KEY_PEM }}
        run: |
          test -n "$KALSHI_PROD_KEY_ID"
          test -n "$PRIVATE_KEY"
          umask 077
          mkdir -p .secrets
          printf '%s' "$PRIVATE_KEY" > "$KALSHI_PROD_KEY_PATH"
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest -q
      - name: Export baseline
        run: uv run src/backtest.py BTC --max-markets 100
      - name: Upload dataset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-baseline
          path: output/baseline
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary key
        if: always()
        run: rm -f "$KALSHI_PROD_KEY_PATH"

name: authenticated backtest

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/backtest-trigger"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KALSHI_ENV: prod
      KALSHI_PROD_KEY_ID: ${{ secrets.KALSHI_PROD_KEY_ID }}
      KALSHI_PROD_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PROD_PRIVATE_KEY_PEM }}
      KALSHI_PROD_KEY_PATH: .secrets/kalshi_prod.pem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check Kalshi secrets
        id: credentials
        shell: bash
        run: |
          if [[ -z "$KALSHI_PROD_KEY_ID" || -z "$KALSHI_PROD_PRIVATE_KEY_PEM" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated backtest skipped: configure Actions secrets KALSHI_PROD_KEY_ID and KALSHI_PROD_PRIVATE_KEY_PEM."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize private key
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s' "$KALSHI_PROD_PRIVATE_KEY_PEM" > "$KALSHI_PROD_KEY_PATH"

      - name: Install
        if: steps.credentials.outputs.available == 'true'
        run: python -m pip install -e .

      - name: Resolve sample size
        id: sample
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          raw="$(tr -d '[:space:]' < .github/backtest-trigger)"
          if [[ "$raw" =~ ^[0-9]+$ && "$raw" -gt 0 ]]; then
            max_markets="$raw"
          else
            max_markets=100
          fi
          echo "max_markets=$max_markets" >> "$GITHUB_OUTPUT"

      - name: 100-market model calibration
        if: steps.credentials.outputs.available == 'true'
        run: |
          python src/research/backtest.py BTC             --max-markets 100             --min-edge-cents 2             --vol-window-seconds 300             --skip-tape             --skip-quotes             --output-dir output/calibration_100

      - name: Upload calibration
        if: steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-calibration-100
          path: output/calibration_100
          if-no-files-found: error
          retention-days: 14

      - name: Market-relative diagnostics
        if: steps.credentials.outputs.available == 'true'
        run: |
          python src/research/backtest.py BTC             --max-markets ${{ steps.sample.outputs.max_markets }}             --min-edge-cents 2             --vol-window-seconds 300             --output-dir output/backtests

      - name: Production taker-strategy replay
        if: steps.credentials.outputs.available == 'true'
        run: |
          python src/research/strategy_backtest.py BTC             --max-markets 100             --starting-cash-cents 100000             --fee-multiplier 1.0             --assumed-top-size 10             --output-dir output/strategy_backtests

      - name: Upload results
        if: steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-backtest-results
          path: |
            output/backtests
            output/strategy_backtests
          if-no-files-found: error
          retention-days: 14

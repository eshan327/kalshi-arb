name: settlement debug

on:
  push:
    paths:
      - ".github/settlement-debug-trigger"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KALSHI_ENV: prod
      KALSHI_PROD_KEY_ID: ${{ secrets.KALSHI_PROD_KEY_ID }}
      KALSHI_PROD_PRIVATE_KEY_PEM: ${{ secrets.KALSHI_PROD_PRIVATE_KEY_PEM }}
      KALSHI_PROD_KEY_PATH: .secrets/kalshi_prod.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Materialize key
        shell: bash
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s' "$KALSHI_PROD_PRIVATE_KEY_PEM" > "$KALSHI_PROD_KEY_PATH"
      - name: Install
        run: python -m pip install -e .
      - name: Inspect one settlement window
        run: |
          python - <<'PY'
          import time
          from core.market_profiles import get_market_profile
          from core.market_metadata import extract_suggested_strike, extract_settlement_decimals
          from data.kalshi_rest import get_settled_markets
          from engine.market_stream.discovery import parse_iso8601_to_epoch
          from research.backtest import fetch_cf_feeds, _latest_tick, _settlement_state
          from engine.pricing.pipeline import compute_pricing_snapshot

          p = get_market_profile("BTC")
          cutoff = time.time() - 20*60
          markets = [
              m for m in get_settled_markets(p.kalshi_series_ticker)
              if str(m.get("result") or "").lower() in {"yes","no"}
              and extract_suggested_strike(m) is not None
              and (parse_iso8601_to_epoch(m.get("close_time")) or 1e99) <= cutoff
          ]
          markets.sort(key=lambda m: parse_iso8601_to_epoch(m.get("close_time")) or 0, reverse=True)
          m = markets[0]
          close = parse_iso8601_to_epoch(m["close_time"])
          start = close - p.settlement_window_seconds
          spot_ticks, fix_ticks, resolution = fetch_cf_feeds(p, close-1200, close+1)
          near = [t for t in fix_ticks if start-3 <= t["ts"] <= close+1]
          print("MARKET", m["ticker"], "CLOSE", close, "START", start, "RES", resolution)
          print("FIX_OFFSETS", [(round(t["ts"]-start,3), t["price"]) for t in near[:70]])
          for h in (60,45,30,20,10,5,1):
              now = close-h+0.4
              latest = _latest_tick(spot_ticks, now)
              st = _settlement_state(fix_ticks, now_ts=now, close_ts=close, window=60, spot_ts=latest["ts"] if latest else None)
              avg = st.get("final_average")
              ticks = [t for t in fix_ticks if now-300 <= t["ts"] <= now]
              snap = compute_pricing_snapshot(
                  profile=p, feed_asset="BTC", spot=latest["price"] if latest else None,
                  ticks=ticks, strike=extract_suggested_strike(m), market_ticker=m["ticker"],
                  close_time_iso=m["close_time"],
                  settlement_decimals=extract_settlement_decimals(m,p.settlement_decimals_fallback),
                  index_state=st, now_ts=now,
              )
              print("H",h,"NOWOFF",round(now-start,3),"LATEST_FIX_OFF",round((_latest_tick(fix_ticks,now) or {"ts":0})["ts"]-start,3),
                    "AVG",avg,"READY",snap.get("ready"),"REASON",snap.get("reason"),
                    "ELAPSED",snap.get("twap_seconds_elapsed"))
          PY

[project]
name = "kalshi-arb"
version = "0.1.0"
description = "Settlement-aware Kalshi baseline, historical research, and guarded execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.5",
    "pydantic>=2.12.5",
    "reflex>=0.9.8",
    "requests>=2.32.5",
    "websockets>=16.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[project]
name = "kalshi-arb"
version = "0.1.0"
description = "Kalshi crypto market data, settlement pricing, and historical research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.5",
    "requests>=2.32.5",
    "websockets>=16.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
